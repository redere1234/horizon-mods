id = "appleskin"
kind = "mod"
name = "AppleSkin"
summary = "HUD de comida con saturación, agotamiento, previsualización y valores nutricionales."
description = """
AppleSkin añade mejoras visuales relacionadas con la alimentación en Minecraft sobre Horizon. Muestra la saturación y el agotamiento en la barra de comida, permite previsualizar lo que restaura el alimento que llevas en la mano y añade valores de hambre y saturación a las descripciones de los objetos, además de una estimación de la salud recuperada.

Es un mod principalmente visual: no añade objetos ni cambia recetas. Esta versión es una adaptación para Horizon del proyecto AppleSkin de squeek502; el código original y esta adaptación se distribuyen bajo Unlicense.
"""
authors = ["Dinorap4009", "squeek502"]
owners = ["redere1234"]
license = "Unlicense"
